# 集中配置微调工具日志；仅输出流程元数据，不记录正文或凭证。
[loggers]
keys=root,knowledge_finetuning

[handlers]
keys=console

[formatters]
keys=flow

[logger_root]
level=WARNING
handlers=

[logger_knowledge_finetuning]
level=INFO
handlers=console
qualname=knowledge_finetuning
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=flow
args=(sys.stderr,)

[formatter_flow]
format=%(asctime)s %(levelname)s run_id=%(run_id)s %(message)s
